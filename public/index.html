<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SNES Dataset</title>
<meta name="description" content="Browsable metadata + box art dataset for Super Nintendo (SNES) games.">
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #232b38; --text: #e6edf3;
    --muted: #8b96a5; --accent: #58a6ff; --gold: #d29922;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 10; padding: 14px 20px;
    background: rgba(13,17,23,.92); backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--border);
  }
  .bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; max-width: 1280px; margin: 0 auto; }
  h1 { font-size: 17px; margin: 0 8px 0 0; letter-spacing: .3px; }
  h1 span { color: var(--accent); }
  #q {
    flex: 1; min-width: 200px; padding: 8px 12px; font-size: 15px; color: var(--text);
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px; outline: none;
  }
  #q:focus { border-color: var(--accent); }
  select {
    padding: 8px; color: var(--text); background: var(--panel);
    border: 1px solid var(--border); border-radius: 8px; font-size: 14px;
  }
  label.toggle { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 14px; cursor: pointer; }
  #count { color: var(--muted); font-size: 13px; margin-left: auto; white-space: nowrap; }
  main { max-width: 1280px; margin: 0 auto; padding: 18px 20px 60px; }
  .grid {
    display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  }
  .card { text-decoration: none; color: inherit; }
  .cover {
    aspect-ratio: 3/4; border-radius: 10px; overflow: hidden;
    background: linear-gradient(160deg, #1c2531, #10161d);
    border: 1px solid var(--border); position: relative;
  }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover.ph::after {
    content: attr(data-initials); position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 34px; font-weight: 700; color: #2d3b4d; letter-spacing: 2px;
  }
  .t { font-size: 13.5px; font-weight: 600; margin-top: 7px;
       overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .y { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #more { display: block; margin: 26px auto; padding: 9px 22px; font-size: 14px;
          color: var(--text); background: var(--panel); border: 1px solid var(--border);
          border-radius: 8px; cursor: pointer; }
  #more:hover { border-color: var(--accent); }
  /* detail overlay */
  #modal {
    position: fixed; inset: 0; background: rgba(5,8,12,.8); display: none;
    overflow-y: auto; padding: 30px 14px; z-index: 50;
  }
  #modal.open { display: block; }
  .sheet {
    max-width: 860px; margin: 0 auto; background: var(--panel);
    border: 1px solid var(--border); border-radius: 14px; padding: 26px; position: relative;
  }
  #close {
    position: absolute; top: 12px; right: 14px; font-size: 22px; line-height: 1;
    background: none; border: 0; color: var(--muted); cursor: pointer;
  }
  #close:hover { color: var(--text); }
  .head { display: flex; gap: 22px; flex-wrap: wrap; }
  .head .art { width: 190px; flex-shrink: 0; }
  .head .art img { width: 100%; border-radius: 10px; border: 1px solid var(--border); display: block; }
  .head h2 { margin: 0 0 2px; font-size: 24px; }
  .sub { color: var(--muted); margin-bottom: 12px; }
  .pill {
    display: inline-block; margin: 2px 4px 2px 0; padding: 2px 9px; font-size: 12.5px;
    background: #1c2531; border: 1px solid var(--border); border-radius: 999px; color: var(--text);
  }
  .score { color: var(--gold); font-weight: 700; }
  dl { display: grid; grid-template-columns: 130px 1fr; gap: 6px 14px; margin: 18px 0 0; font-size: 14px; }
  dt { color: var(--muted); } dd { margin: 0; }
  .desc { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border); }
  .links { margin-top: 16px; font-size: 13.5px; }
  .links a { color: var(--accent); text-decoration: none; margin-right: 14px; }
  .links a:hover { text-decoration: underline; }
  footer { color: var(--muted); font-size: 12.5px; text-align: center; padding: 0 20px 40px; }
  footer a { color: var(--accent); text-decoration: none; }
  @media (max-width: 640px) { dl { grid-template-columns: 105px 1fr; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>SNES <span>Dataset</span></h1>
    <input id="q" type="search" placeholder="Search title, developer, publisher, genre…  (press /)" autocomplete="off">
    <label class="toggle"><input type="checkbox" id="art"> box art only</label>
    <select id="sort">
      <option value="title">A → Z</option>
      <option value="year-desc">Newest first</option>
      <option value="year-asc">Oldest first</option>
    </select>
    <span id="count"></span>
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <button id="more" hidden>Load more</button>
</main>

<footer>
  Metadata compiled from OpenVGDB, Kaggle (CC0) and open datasets — see the
  <a href="https://github.com/mode777/snes-dataset">snes-dataset</a> repo.
  Box art &copy; its respective publishers, provided for research/reference.
</footer>

<div id="modal"><div class="sheet">
  <button id="close" title="Close (Esc)">✕</button>
  <div id="detail"></div>
</div></div>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CHUNK = 240;
const state = { items: [], shown: 0, q: "", sort: "title", art: false };
let io = new IntersectionObserver((entries) => {
  for (const e of entries) {
    if (!e.isIntersecting) continue;
    const img = e.target;
    img.src = img.dataset.src;
    io.unobserve(img);
  }
}, { rootMargin: "700px" });

async function boot() {
  let catalog;
  try {
    catalog = await (await fetch("catalog.json")).json();
  } catch {
    const idx = await (await fetch("index.json")).json();
    catalog = Object.entries(idx).map(([slug, title]) => ({ slug, title }));
  }
  state.items = catalog;
  $("#q").addEventListener("input", (e) => { state.q = e.target.value; apply(); });
  $("#sort").addEventListener("change", (e) => { state.sort = e.target.value; apply(); });
  $("#art").addEventListener("change", (e) => { state.art = e.target.checked; apply(); });
  $("#more").addEventListener("click", () => renderMore());
  $("#close").addEventListener("click", closeDetail);
  $("#modal").addEventListener("click", (e) => { if (e.target.id === "modal") closeDetail(); });
  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeDetail();
    if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); }
  });
  window.addEventListener("hashchange", route);
  apply();
  route();
}

function filtered() {
  const q = state.q.trim().toLowerCase();
  let items = state.items;
  if (state.art) items = items.filter((g) => g.thumb);
  if (q) items = items.filter((g) =>
    (g.title + " " + (g.developer || "") + " " + (g.publisher || "") + " " + (g.genre || ""))
      .casefold().includes(q));
  const by = {
    "title": (a, b) => a.title.localeCompare(b.title),
    "year-desc": (a, b) => (b.year ?? -1) - (a.year ?? -1) || a.title.localeCompare(b.title),
    "year-asc": (a, b) => (a.year ?? 9999) - (b.year ?? 9999) || a.title.localeCompare(b.title),
  }[state.sort];
  return [...items].sort(by);
}

function apply() {
  state.shown = 0;
  $("#grid").innerHTML = "";
  const items = filtered();
  $("#count").textContent = `${items.length} / ${state.items.length} games`;
  renderMore(items);
}

function renderMore(items = filtered()) {
  const grid = $("#grid");
  const slice = items.slice(state.shown, state.shown + CHUNK);
  state.shown += slice.length;
  const frag = document.createDocumentFragment();
  for (const g of slice) {
    const a = document.createElement("a");
    a.className = "card";
    a.href = "#" + g.slug;
    const initials = g.title.split(/\s+/).slice(0, 2).map((w) => w[0] || "").join("").toUpperCase();
    const cover = g.thumb
      ? `<img loading="lazy" data-src="${esc(g.slug)}/thumb.png" alt="${esc(g.title)} box art">`
      : "";
    a.innerHTML =
      `<div class="cover ${g.thumb ? "" : "ph"}" data-initials="${esc(initials)}">${cover}</div>` +
      `<div class="t" title="${esc(g.title)}">${esc(g.title)}</div>` +
      `<div class="y">${esc(g.year ?? "—")}${g.developer ? " · " + esc(g.developer) : ""}</div>`;
    frag.appendChild(a);
  }
  grid.appendChild(frag);
  grid.querySelectorAll("img[data-src]").forEach((img) => io.observe(img));
  $("#more").hidden = state.shown >= items.length;
}

/* ---------------- detail view (hash routing: #slug) ---------------- */

async function route() {
  const slug = decodeURIComponent(location.hash.slice(1));
  if (!slug) { closeDetail(); return; }
  const meta = state.items.find((g) => g.slug === slug);
  if (!meta) return;
  let d;
  try { d = await (await fetch(encodeURIComponent(slug) + "/data.json")).json(); }
  catch { $("#detail").innerHTML = `<h2>${esc(meta.title)}</h2><p class="sub">Failed to load data.</p>`; openModal(); return; }
  renderDetail(slug, d);
  openModal();
}

function renderDetail(slug, d) {
  const img = d.images || {};
  const art = (img.thumb || img.box)
    ? `<img src="${esc(slug)}/${esc(img.thumb || img.box)}" alt="${esc(d.title)} box art"
           onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'cover ph',dataset:{initials:'?'}}))">`
    : "";
  const pills = [
    ...[...new Set([...(d.genre || []), ...(d.tags || [])])].map((g) => `<span class="pill">${esc(g)}</span>`),
  ].join("");
  const dates = Object.entries(d.release_dates || {})
    .map(([r, v]) => `<dt>${esc(r.replace(/_/g, " "))}</dt><dd>${esc(v)}</dd>`).join("");
  const row = (k, v) => (v ? `<dt>${k}</dt><dd>${v}</dd>` : "");
  const list = (arr) => (arr || []).map(esc).join(", ");
  $("#detail").innerHTML = `
    <div class="head">
      <div class="art">${art}</div>
      <div style="flex:1;min-width:240px">
        <h2>${esc(d.title)}</h2>
        <div class="sub">${esc(d.year ?? "year unknown")}
          ${d.gf_score ? ` · <span class="score">★ ${esc(d.gf_score)}</span>` : ""}
          ${d.metascore ? ` · Metacritic ${esc(d.metascore)}` : ""}</div>
        ${pills ? `<div>${pills}</div>` : ""}
        <dl>
          ${row("Developer", list(d.developer))}
          ${row("Publisher", list(d.publisher))}
          ${row("Players", esc(d.players))}
          ${row("Languages", list(d.languages))}
          ${dates}
          ${row("Also known as", list(d.aliases))}
        </dl>
      </div>
    </div>
    ${d.description ? `<div class="desc">${esc(d.description)}</div>` : ""}
    <div class="links">
      <a href="${esc(slug)}/data.json" target="_blank" rel="noopener">data.json</a>
      ${d.cover_urls ? d.cover_urls.map((u, i) =>
        `<a href="${esc(u)}" target="_blank" rel="noopener">cover ${i + 1} ↗</a>`).join("") : ""}
    </div>`;
}

function openModal() { $("#modal").classList.add("open"); document.body.style.overflow = "hidden"; }
function closeDetail() {
  $("#modal").classList.remove("open");
  document.body.style.overflow = "";
  if (location.hash) history.replaceState(null, "", location.pathname + location.search);
}

boot();
</script>
</body>
</html>
