[project]
name = "snes-dataset"
version = "0.2.0"
description = "Build and publish a static SNES games dataset"
readme = "README.md"
license = "CC0-1.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "rapidfuzz>=3.14.6",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
