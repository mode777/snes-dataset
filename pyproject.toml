[project]
name = "snes-dataset"
version = "0.1.0"
description = "Crawler tooling for building a SNES dataset"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "scrapy>=2.13",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
